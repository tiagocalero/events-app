<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Consulta Registro</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/headerLoggedIn.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Consulte los Registros de sus Eventos:</strong></h3><br/>
      
          <form class="content-form-alta" action="info_tipo_registro" method="post">
            
            <label for="edicionSelect">Seleccione una Edicion:</label>
            <select id="edicionSelect" name="nivel">
              <option value="">Seleccione una Edicion</option>
              <option value="Maraton de Montevideo 2024">Maraton de Montevideo 2024</option>
              <option value="Maraton de Montevideo 2022">Maraton de Montevideo 2022</option>
              <option value="Tecnologıa Punta del Este 2026">Tecnologıa Punta del Este 2026</option>
              <option value="Mobile World Congress 2025">Mobile World Congress 2025</option>
              <option value="Web Summit 2026">Web Summit 2026</option>
            </select><br/>

            <label for="usuarioSelect">Seleccione un Usuario:</label>
            <select id="usuarioSelect" name="nivel">
              <option value="">Seleccione un Usuario</option>
              </select><br/><br/>
            
            <h5 id="usuarioHeader">Los datos del Registro de *Usuario* son los siguientes:</h5>

            <label for="fecha-registro">Fecha de Registro:</label>
            <input type="text" id="fecha-registro" value="30/07/2024" readonly/><br/>

            <label for="tipo-registro">Tipo de Registro:</label>
            <input type="text" id="tipo-registro" value="TR07" readonly/><br/>

            <label for="codigo-patrocinio">Uso codigo de Patrocinio:</label>
            <input type="text" id="codigo-patrocinio" value="No" readonly/><br/>
          </form>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
</body>
</html>
