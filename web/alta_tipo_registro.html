<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Inicio</title>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>

<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Ingrese los datos del nuevo tipo de registro:</strong></h3>
      <form action="info_tipo_registro" method="post">
        <label for= "Nombre">Nombre:</label>
        <input type = "text" id = "name" name = "name"/><br/>
        <label for= "Descripción">Descripción:</label>
        <input type = "text" id = "Descripción" name = "Descripción"/><br/>
        <label for= "c">Costo:</label>
        <input type = "text" id = "c" name = "c"/><br/>
        <label for= "Cupo">Cupo:</label>
        <input type = "text" id = "Cupo" name = "Cupo"/><br/><br/>
        <input type="submit" value = "registrar"/>

      </form>
      
    </div>

    <style>
      label {
        display: inline-block;   /* hace que ocupe un bloque */
        width: 120px;            /* ancho fijo para alinear los inputs */
        margin-right: 10px;      /* espacio entre label y input */
      }

      input[type="text"] {
        width: 180px; /* todos los inputs del mismo ancho */
      }
    </style>

    <div class="right-sidebar">
        <h4>Eventos</h4>
        <p><a href="evento.html">Maratón de Montevideo</a></p>
        <p><a href="evento.html">Feria del Libro</a></p>

    </div>
