<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Consulta Registro</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/headerLoggedIn.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
  <link rel="icon" type="image/png" href="assets/logoChico.png">
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Consulte los Registros a sus Eventos:</strong></h3><br/>
      
          <form class="content-form-alta" action="info_tipo_registro" method="post">
            
            <label for="nivel">Seleccione una Edicion:</label>
            <select id="nivel" name="nivel">
              <option value="platino">Maraton de Montevideo 2024</option>
              <option value="oro">Web Summit 2026 </option>
            </select><br/><br/>
            
            <h5>Los datos del Registro a *Edicion*:</h5>

            <label for= "name">Fecha de Registro:</label>
            <input type="text" id="fecha-registro" value="21/08/2025" readonly/><br/>
            
            <label for= "sigla">Tipo de Registro:</label>
            <input type="text" id="tipo-registro" value="TR25" readonly/><br/>
            
            <label for= "ciudad">Uso codigo de Patrocinio:</label>
            <input type="text" id="codigo-patrocinio" value="Sí" readonly/><br/>

          </form>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
