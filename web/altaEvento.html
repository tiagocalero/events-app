<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Alta de Evento</title>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/headerLoggedIn.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
  <script src="altaEvento.js" type="text/javascript" defer></script>
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Ingrese los datos del nuevo evento:</strong></h3><br/>
      <form class="content-form-alta" onsubmit="return validarSeleccion()" action="info_tipo_registro" method="post">
        <label for= "name">Nombre:</label>
        <input type = "text" id = "name" name = "name" required/><br/>
        
        <label for= "desc">Descripción:</label>
        <input type = "text" id = "desc" name = "desc"/><br/>
        
        <label for= "sigla">Sigla:</label>
        <input type = "text" id = "sigla" name = "sigla"/><br/>
        
        <label for="categorias" style="vertical-align: top">Selecciona una o varias categorías:</label>
        <select id="categorias" name="categorias" multiple size="3">
          <option value="categoria1">Categoría 1</option>
          <option value="categoria2">Categoría 2</option>
          <option value="categoria3">Categoría 3</option>
          <option value="categoria4">Categoría 4</option>
        </select><br/>
        
        <input type="reset" value = "Borrar"/>
        <input type="submit" value = "Crear"/>
      </form>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
