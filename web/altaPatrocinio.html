<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Inicio</title>
  
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Ingrese los datos del nuevo patrocinio:</strong></h3>
      <form action="info_tipo_registro" method="post">
		<label for="nivel">Nivel patrocinio:</label>
		<select id="nivel" name="nivel">
		  <option value="platino">Platino</option>
		  <option value="oro">Oro</option>
		  <option value="plata">Plata</option>
		  <option value="bronce">Bronce</option>
		</select><br/>
        <label for = "monto">Aporte económico:</label>
        <input type = "number" id = "monto" name = "monto" min="0" step="0.01"/><br/>
        <label for = "cantRegistros">Cantidad de Registros Gratuitos:</label>
        <input type = "number" id = "cantRegistros" name = "cantRegistros" min="0" step="any"/><br/>
		<label for="tregistro">Tipo de registro gratuito:</label>
		<select id="tregistro" name="tregistro">
		  <option value="42k">Corredor 42k</option>
		  <option value="21k">Corredor 21k</option>
		  <option value="10k">Corredor 10k</option>
		</select><br/>
		<label for="codigo">Código:</label>
		<input type = "text" id = "codigo" name = "codigo"/><br/>
        <input type="submit" value = "Crear"/>
      </form>
    </div>

    <style>
      label {
        display: inline-block;   /* hace que ocupe un bloque */
        width: 120px;            /* ancho fijo para alinear los inputs */
        margin-right: 10px;      /* espacio entre label y input */
      }

      input[type="text"], input[type="number"], select {
        width: 180px; /* todos los inputs del mismo ancho */
      }
    </style>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
