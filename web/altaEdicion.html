<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Inicio</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Ingrese los datos de la nueva Edicion:</strong></h3><br/>
      
          <form class="content-form-alta" action="info_tipo_registro" method="post">
            
            <label for="nivel">Seleccione un Evento:</label>
            <select id="nivel" name="nivel">
              <option value="platino">evento1</option>
              <option value="oro">evento2</option>
              <option value="plata">evento3</option>
              <option value="bronce">evento4</option>
            </select><br/>
            
            <label for= "name">Nombre:</label>
            <input type = "text" id = "name" name = "name"/><br/>
            
            <label for= "sigla">Sigla:</label>
            <input type = "text" id = "sigla" name = "desc"/><br/>
            
            <label for= "ciudad">Ciudad:</label>
            <input type = "text" id = "ciudad" name = "ciudad"/><br/>

            <label for= "pais">Pais:</label>
            <input type = "text" id = "pais" name = "pais"/><br/>
            
            <label for="fecha-inicio">Selecciona una fecha:</label>
            <input type="date" id="fecha-inicio" name="fecha-inicio"><br/>

            <label for="fecha-fin">Selecciona una fecha:</label>
            <input type="date" id="fecha-fin" name="fecha-fin"><br/>

            <label for="foto">Selecciona una foto:</label>
            <input type="file" id="foto" name="foto"><br/>

            <input type="reset" value = "Borrar"/>
            <input type="submit" value = "Crear"/>
          </form>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
