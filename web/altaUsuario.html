<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos.uy - Inicio</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://www.nerdfonts.com/assets/css/webfont.css" rel="stylesheet">
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/sidebar.js" type="text/javascript" defer></script>
</head>
<body>
  <header-component></header-component>

  <main>
    <sidebar-component></sidebar-component>

    <div class="content">
      <h3><strong>Ingrese los datos del nuevo Usuario:</strong></h3><br/>
          <button type="button" id="tipoUsuario" onclick="toggleInput()">Asistente</button><br/>
      
          <form class="content-form-alta" action="alta_usuario" method="post">
            
            <label for="nickname">Nickname:</label>
            <input type="text" id="nickname" name="nickname"/><br/>

            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name"/><br/>

            <label for="correo">Correo Electrónico:</label>
            <input type="text" id="correo" name="correo"/><br/>

            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="pass"/>
            <button type="button" id="passbtn" onclick="togglePassword()"><i class="nf nf-cod-eye"></i></button><br/>

            <label for="passconf">Confirma la Contraseña:</label>
            <input type="password" id="passconf" name="passconf"/><br/>

            <label for="foto">Seleccione una Imágen:</label>
            <input type="file" id="foto" name="foto"><br/>

            <label for="apellido" id="apellidolbl">Apellido:</label>
            <input type="text" id="apellido" name="apellido"/><br/>

            <label for="nacimiento" id="nacimientolbl">Seleccione una Fecha:</label>
            <input type="date" id="nacimiento" name="nacimiento"><br/>

            <label for="link" id="linklbl" style="display:none">Link:</label>
            <input type="text" id="link" name="link" style="display:none"/><br/>

            <label for="desc" id="desclbl" style="display:none">Description:</label>
            <textarea id="desc" name="desc" style="display:none" rows="5" cols="50" placeholder="Enter your description..."></textarea><br/>

            <input type="reset" value="Borrar"/>
            <input type="submit" value="Crear"/>
          </form>
    </div>

  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById("pass");
      const input2 = document.getElementById("passconf");
      const icon = document.querySelector("#passbtn i");

      const isHidden = input.type === "password";

      input.type = isHidden ? "text" : "password";
      input2.type = isHidden ? "text" : "password";

      icon.classList.toggle("nf-cod-eye");
      icon.classList.toggle("nf-cod-eye_closed");
    }
    function toggleInput() {
      const btn = document.getElementById('tipoUsuario');
      const ap = document.getElementById('apellido');
      const aplbl = document.getElementById('apellidolbl');
      const nac = document.getElementById('nacimiento');
      const naclbl = document.getElementById('nacimientolbl');
      const link = document.getElementById('link');
      const linklbl = document.getElementById('linklbl');
      const desc = document.getElementById('desc');
      const desclbl = document.getElementById('desclbl');

      if (btn.textContent == 'Organizador') {
          btn.textContent = 'Asistente'
          ap.style.display = 'inline-block';
          aplbl.style.display = 'inline-block';
          nac.style.display = 'inline-block';
          naclbl.style.display = 'inline-block';
          link.style.display = 'none';
          linklbl.style.display = 'none';
          desc.style.display = 'none';
          desclbl.style.display = 'none';
      } else {
          btn.textContent = 'Organizador'
          ap.style.display = 'none';
          aplbl.style.display = 'none';
          nac.style.display = 'none';
          naclbl.style.display = 'none';
          link.style.display = 'inline-block';
          linklbl.style.display = 'inline-block';
          desc.style.display = 'inline-block';
          desclbl.style.display = 'inline-block';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
